exclude: ".*/vendor/.*"
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
      hooks:
          - id: check-added-large-files
            args: ["--maxkb=256"]
          - id: check-ast
          - id: fix-byte-order-marker
          - id: check-case-conflict
          - id: check-docstring-first
          - id: check-executables-have-shebangs
          - id: check-json
          - id: check-merge-conflict
          - id: check-symlinks
          - id: check-xml
          - id: check-yaml
          - id: debug-statements
          - id: detect-aws-credentials
            args: ["--allow-missing-credentials"]
          - id: detect-private-key
          - id: end-of-file-fixer
          - id: mixed-line-ending
            args: ["--fix=lf"]
          - id: pretty-format-json
            args: ["--autofix", "--no-sort-keys", "--indent=4"]
          - id: trailing-whitespace
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: 1f1e8bf348ff38fc88619a38d3ca4d9c56abea49 # frozen: v0.16.5
      hooks:
          - id: ruff-check
            args: ["--fix", "--exit-non-zero-on-fix"]
          - id: ruff-format
    - repo: https://github.com/gruntwork-io/pre-commit
      rev: 40f924cd642f5dc98d12bd97b07f3752223553da # frozen: v0.1.30
      hooks:
          - id: shellcheck
    - repo: https://github.com/asottile/blacken-docs
      rev: fda77690955e9b63c6687d8806bafd56a526e45f # frozen: 1.20.0
      hooks:
          - id: blacken-docs
    - repo: local
      hooks:
          - id: prettier
            name: prettier
            language: system
            entry: npx --yes prettier --write --ignore-unknown
            types_or: [css, markdown, javascript, jsx, ts, tsx, html]
            pass_filenames: true
          - id: eslint
            name: eslint
            language: system
            entry: npx --yes eslint
            types_or: [javascript, jsx, ts, tsx]
            exclude_types:
                - json
            pass_filenames: true
          - id: stylelint
            name: stylelint
            language: system
            entry: npx --yes stylelint
            types_or: [css, scss]
            pass_filenames: true
